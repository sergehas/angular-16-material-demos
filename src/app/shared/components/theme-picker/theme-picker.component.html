<button
  class="theme-btn"
  mat-icon-button
  [matMenuTriggerFor]="themeMenu"
  [matTooltip]="'THEME-PICKER.TOOLTIP' | translate"
  aria-label="Select a theme"
  type="button"
>
  <mat-icon>format_color_fill</mat-icon>
</button>

<mat-menu #themeMenu="matMenu" xPosition="before" class="app-theme-picker-menu">
  <div class="app-theme-picker-controls">
    <mat-button-toggle-group
      class="app-theme-picker-scheme-toggle"
      [(ngModel)]="currentScheme"
      aria-label="light scheme"
      [hideSingleSelectionIndicator]="true"
      (change)="selectScheme(currentScheme)"
    >
      <mat-button-toggle value="light"><mat-icon>light_mode</mat-icon></mat-button-toggle>
      <mat-button-toggle value="dark"><mat-icon>dark_mode</mat-icon></mat-button-toggle>
      <mat-button-toggle value="auto"><mat-icon>brightness_auto</mat-icon></mat-button-toggle>
    </mat-button-toggle-group>
  </div>
  <mat-nav-list>
    @for (theme of themes; track theme) {
      <a
        mat-list-item
        [activated]="theme.equals(currentTheme)"
        (click)="$event.preventDefault(); selectTheme(theme)"
        (keydown)="$event.preventDefault(); selectTheme(theme)"
        role="button"
        tabindex="0"
      >
        <mat-icon
          matListItemIcon
          [attr.local-theme]="theme.className"
          class="theme-example-icon"
          [class]="theme.className + 'z'"
          svgIcon="theme-color"
        >
        </mat-icon>
        <span matListItemTitle>{{ theme.name }}</span>
        <div matListItemMeta>
          <mat-icon>folder</mat-icon>
        </div>
      </a>
    }
  </mat-nav-list>
</mat-menu>
